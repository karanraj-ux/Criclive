allprojects {
    afterEvaluate {
        tasks.configureEach { task ->
            if (task.name == "compileReleaseKotlin") {
                task.doFirst {
                    println("Compiler args for ${task.name}:")
                    // Print all properties to find the compiler args
                    println(task.properties.get("pluginOptions"))
                }
            }
        }
    }
}
