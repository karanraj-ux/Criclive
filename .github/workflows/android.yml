name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.14
        validate-wrappers: false


    - name: Generate temporary debug keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        mkdir -p ~/.android
        cp debug.keystore ~/.android/debug.keystore

    - name: Build Release APK
      run: gradle assembleRelease --no-daemon

    - name: Rename APK
      run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/CricLive.apk

    # This modern wildcard expression safely locates and names your download folder without crashing
    - name: Upload Built APKs
      uses: actions/upload-artifact@v4
      with:
        name: CricLive-Distribution-Build
        path: app/build/outputs/apk/release/*.apk
